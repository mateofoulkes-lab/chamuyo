<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chamuyo - Prototipo</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--panel-soft:#1f2937;--text:#f8fafc;--muted:#cbd5e1;--accent:#22c55e;--danger:#ef4444;--border:#334155}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#0b1022 0%,var(--bg) 100%);color:var(--text);min-height:100vh}
.app{width:min(100%,720px);margin:0 auto;padding:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
.logo{max-width:180px;width:60%;height:auto}.logo-sm{max-width:90px;width:40%}.stack{display:grid;gap:12px}.row{display:grid;gap:8px}
button{width:100%;min-height:52px;border:none;border-radius:12px;padding:12px 14px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff;background:#2563eb}
button.secondary{background:#374151}button.success{background:var(--accent);color:#052e16}button.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}
.input,.phrase-input{width:100%;min-height:48px;border:1px solid var(--border);border-radius:10px;background:var(--panel-soft);color:var(--text);padding:10px 12px;font-size:1rem}
.players,.phrases{list-style:none;padding:0;margin:0;display:grid;gap:8px}.players li,.phrase-card{border:1px solid var(--border);border-radius:10px;padding:10px;background:#0b1220}
.phrase-card{min-height:64px;display:flex;align-items:center;font-weight:600}.phrase-card:active{transform:scale(.99)}
.scroll-y{max-height:190px;overflow-y:auto;overflow-x:hidden;padding-right:4px}.ready-player{border-color:#15803d;background:#052e1b}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:.75rem;background:#14532d;color:#dcfce7}
.status{color:var(--muted);font-size:.9rem}.error{color:#fecaca;background:#7f1d1d;padding:8px 10px;border-radius:8px}.ok{color:#dcfce7;background:#14532d;padding:8px 10px;border-radius:8px}.muted-box{color:var(--muted);border:1px dashed var(--border);border-radius:10px;padding:10px}.hidden{display:none!important}
</style>
</head>
<body><main class="app">
<section id="home" class="card stack"><div style="display:flex;justify-content:center"><img class="logo" src="logo.png" alt="Logo Chamuyo"/></div><button id="btnCreateRoom">Crear sala</button><button id="btnJoinRoom" class="secondary">Unirse a sala</button><button disabled>Crear/editar listas (próximamente)</button><div id="homeMsg" class="hidden"></div></section>
<section id="flow" class="card stack hidden"></section>
<section id="lobby" class="card stack hidden"><h2 id="lobbyRoomName">Lobby</h2><p id="lobbyMeta"></p><div id="myPhrasesBox" class="stack"></div><ul id="playersList" class="players"></ul><div id="adminActions" class="stack hidden"><button id="btnStartGame">Iniciar partida</button><button id="btnCloseRoom" class="danger">Cerrar sala</button></div><button id="btnLeaveRoom" class="secondary">Salir</button></section>
<section id="game" class="card stack hidden"><div style="display:flex;justify-content:center"><img class="logo-sm" src="logo.png" alt="Logo Chamuyo"/></div><h3>Tus frases visibles</h3><p id="myPoints" class="status"></p><ul id="visiblePhrases" class="phrases"></ul><div id="copyMsg" class="hidden"></div><h3>Jugadores</h3><div class="scroll-y"><ul id="gamePlayers" class="players"></ul></div><h3>Eventos recientes</h3><div class="scroll-y"><ul id="recentLogs" class="players"></ul></div><div id="openVotesPanel" class="stack"></div><div id="penaltyPanel" class="stack"></div><button id="btnLeaveGame" class="secondary">Salir</button></section>
<section id="finished" class="card stack hidden"><div style="display:flex;justify-content:center"><img class="logo-sm" src="logo.png" alt="Logo Chamuyo"/></div><h2>Partida terminada</h2><p id="finishedWinners"></p><button id="btnFinishedHome" class="success">Volver al inicio</button></section>
<div id="phraseMenu" class="card hidden" style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,420px);z-index:30"><div id="phraseMenuText" class="muted-box"></div><div class="stack" style="margin-top:8px"><button id="btnSaid" class="success">La dije</button><button id="btnSwap" class="secondary">Intercambiarla</button><button id="btnRemoveWithPoints" class="secondary">Eliminar con 2 puntos</button><button id="btnCloseMenu" class="danger">Cerrar</button></div><div id="menuMsg" class="hidden"></div></div><div id="userMenu" class="card hidden" style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,420px);z-index:31"><div id="userMenuTitle" class="muted-box"></div><div class="stack" style="margin-top:8px"><button id="btnChallenge" class="success">Denunciar chamuyo</button><button id="btnKickUser" class="secondary">Echar usuario (pendiente)</button><button id="btnCloseUserMenu" class="danger">Cerrar</button></div></div><div id="challengeModal" class="card hidden" style="position:fixed;inset:auto 12px 12px 12px;z-index:32;max-width:680px;margin:0 auto"><h3>¿Qué frase querés denunciar?</h3><textarea id="challengeInput" class="input" rows="3"></textarea><div class="stack"><button id="btnConfirmChallenge" class="success">Confirmar denuncia</button><button id="btnCancelChallenge" class="secondary">Cancelar</button><div id="challengeMsg" class="hidden"></div></div></div></main>
<script type="module">
import { init, id, tx } from "https://esm.sh/@instantdb/browser";
const APP_ID="7203fb46-2446-462f-b1a2-d6600f527872"; const db=init({appId:APP_ID}); const CLIENT_ID_KEY="chamuyo_client_id"; const clientId=getOrCreateClientId();
const $=(id)=>document.getElementById(id);
const ui={
  home:$("home"),flow:$("flow"),lobby:$("lobby"),game:$("game"),finished:$("finished"),
  finishedWinners:$("finishedWinners"),btnFinishedHome:$("btnFinishedHome"),homeMsg:$("homeMsg"),
  btnCreateRoom:$("btnCreateRoom"),btnJoinRoom:$("btnJoinRoom"),lobbyRoomName:$("lobbyRoomName"),lobbyMeta:$("lobbyMeta"),playersList:$("playersList"),
  adminActions:$("adminActions"),btnStartGame:$("btnStartGame"),btnCloseRoom:$("btnCloseRoom"),btnLeaveRoom:$("btnLeaveRoom"),btnLeaveGame:$("btnLeaveGame"),
  myPhrasesBox:$("myPhrasesBox"),visiblePhrases:$("visiblePhrases"),gamePlayers:$("gamePlayers"),recentLogs:$("recentLogs"),copyMsg:$("copyMsg"),myPoints:$("myPoints"),
  phraseMenu:$("phraseMenu"),phraseMenuText:$("phraseMenuText"),btnSaid:$("btnSaid"),btnSwap:$("btnSwap"),btnRemoveWithPoints:$("btnRemoveWithPoints"),btnCloseMenu:$("btnCloseMenu"),menuMsg:$("menuMsg"),
  userMenu:$("userMenu"),userMenuTitle:$("userMenuTitle"),btnChallenge:$("btnChallenge"),btnKickUser:$("btnKickUser"),btnCloseUserMenu:$("btnCloseUserMenu"),
  challengeModal:$("challengeModal"),challengeInput:$("challengeInput"),btnConfirmChallenge:$("btnConfirmChallenge"),btnCancelChallenge:$("btnCancelChallenge"),challengeMsg:$("challengeMsg"),
  penaltyPanel:$("penaltyPanel"),openVotesPanel:$("openVotesPanel")
};
let currentRoomId=null,currentPlayerId=null,selectedPhrase=null,selectedAccusedId=null;
ui.btnCreateRoom.onclick=showCreateRoomFlow; ui.btnFinishedHome.onclick=resetToHome; ui.btnLeaveRoom.onclick=leaveRoom; ui.btnLeaveGame.onclick=leaveRoom; ui.btnJoinRoom.onclick=showJoinRoomFlow; ui.btnCloseRoom.onclick=closeRoomAsAdmin; ui.btnStartGame.onclick=()=>startGame(currentRoomId); ui.btnCloseMenu.onclick=closePhraseMenu; ui.btnSaid.onclick=()=>selectedPhrase&&markPhraseAsSaid(selectedPhrase); ui.btnSwap.onclick=()=>selectedPhrase&&swapPhrase(selectedPhrase); ui.btnRemoveWithPoints.onclick=()=>selectedPhrase&&removePhraseWithPoints(selectedPhrase); setInterval(resolveExpiredSaidPhrases,3000); setInterval(resolveExpiredPenaltyRequests,4000); ui.btnCloseUserMenu.onclick=closeUserMenu; ui.btnChallenge.onclick=openChallengeModal; ui.btnKickUser.onclick=()=>selectedAccusedId&&kickPlayer(selectedAccusedId); ui.btnCancelChallenge.onclick=closeChallengeModal; ui.btnConfirmChallenge.onclick=confirmChallenge;
db.subscribeQuery({rooms:{},players:{},phrases:{},logs:{},phraseAuthors:{},challenges:{},penaltyPhraseRequests:{},votes:{},voteBallots:{}},(resp)=>{if(resp?.error||!currentRoomId)return; const rooms=resp.data.rooms||[],players=(resp.data.players||[]).filter(p=>p.roomId===currentRoomId),phrases=(resp.data.phrases||[]).filter(p=>p.roomId===currentRoomId),logs=(resp.data.logs||[]).filter(l=>l.roomId===currentRoomId); const room=rooms.find(r=>r.id===currentRoomId); if(!room||room.status==="closed"){showMessage(ui.homeMsg,"La sala fue cerrada.",true);return resetToHome();} if(room.status==="finished"){return renderFinishedScreen(room);} if(room.status==="playing") renderGame(room,players,phrases,logs); else renderLobby(room,players,phrases);});

function showCreateRoomFlow(){ui.home.classList.add("hidden");ui.game.classList.add("hidden");ui.lobby.classList.add("hidden");ui.flow.classList.remove("hidden"); ui.flow.innerHTML=`<h2>Crear sala</h2><div class="row"><label>Nombre de sala</label><input id="roomName" class="input" maxlength="30"></div><div class="row"><label>Contraseña</label><input id="roomPass" class="input" type="password" maxlength="30"></div><div class="row"><label>Tu nombre de jugador</label><input id="playerName" class="input" maxlength="24"></div><button id="submitCreate" class="success">Crear y entrar</button><button id="cancelFlow" class="secondary">Cancelar</button><div id="flowMsg" class="hidden"></div>`; document.getElementById("submitCreate").onclick=createRoomAndAdmin; document.getElementById("cancelFlow").onclick=resetToHome;}
function showJoinRoomFlow(){ui.home.classList.add("hidden");ui.game.classList.add("hidden");ui.lobby.classList.add("hidden");ui.flow.classList.remove("hidden"); ui.flow.innerHTML=`<h2>Unirse a sala</h2><div class="row"><label>Nombre de sala</label><input id="roomName" class="input" maxlength="30"></div><div class="row"><label>Contraseña</label><input id="roomPass" class="input" type="password" maxlength="30"></div><div class="row"><label>Tu nombre de jugador</label><input id="playerName" class="input" maxlength="24"></div><button id="submitJoin" class="success">Entrar</button><button id="cancelFlow" class="secondary">Cancelar</button><div id="flowMsg" class="hidden"></div>`; document.getElementById("submitJoin").onclick=joinRoom; document.getElementById("cancelFlow").onclick=resetToHome;}
async function createRoomAndAdmin(){const roomName=readInput("roomName"),password=readInput("roomPass"),playerName=readInput("playerName"),msg=document.getElementById("flowMsg"); if(!roomName||!password||!playerName)return showMessage(msg,"Completá todos los campos.",true); const roomId=id(),playerId=id(),now=Date.now(); const roomTx=tx.rooms[roomId].update({name:roomName,nameNorm:norm(roomName),password,status:"lobby",createdAt:now,adminPlayerId:playerId}).players[playerId].update({roomId,name:playerName,nameNorm:norm(playerName),isAdmin:true,status:"naming",joinedAt:now,points:0,swapsLeft:2,clientId}); await db.transact(roomTx); await createLog(roomId,`${playerName} se unió a la sala`); currentRoomId=roomId;currentPlayerId=playerId;openLobby();}
async function joinRoom(){const roomName=readInput("roomName"),password=readInput("roomPass"),playerName=readInput("playerName"),msg=document.getElementById("flowMsg"); if(!roomName||!password||!playerName)return showMessage(msg,"Completá todos los campos.",true); const resp=await db.queryOnce({rooms:{},players:{}}),rooms=resp.data.rooms||[],players=resp.data.players||[]; const room=rooms.find(r=>r.nameNorm===norm(roomName)&&r.status!=="closed"); if(!room)return showMessage(msg,"Sala no encontrada.",true); if(room.password!==password)return showMessage(msg,"Contraseña incorrecta.",true); if(players.some(p=>p.roomId===room.id&&p.nameNorm===norm(playerName)&&p.status!=="left"&&p.status!=="kicked"))return showMessage(msg,"Ese nombre ya está en uso.",true); const playerId=id(); await db.transact(tx.players[playerId].update({roomId:room.id,name:playerName,nameNorm:norm(playerName),isAdmin:false,status:"naming",joinedAt:Date.now(),points:0,swapsLeft:2,clientId})); await createLog(room.id,`${playerName} se unió a la sala`); currentRoomId=room.id;currentPlayerId=playerId;openLobby();}
function validatePhraseInputs(raw,existing){const local=new Set(); for(let i=0;i<raw.length;i++){const n=normalizePhrase(raw[i]); if(!n)return{ok:false,error:`La frase ${i+1} está vacía.`}; if(local.has(n))return{ok:false,error:`La frase ${i+1} está repetida en tu lista.`}; if(existing.has(n))return{ok:false,error:`La frase ${i+1} ya existe en la sala.`}; local.add(n);} return{ok:true};}
async function savePlayerPhrases(){const formMsg=document.getElementById("phrasesMsg"),inputs=[...document.querySelectorAll(".phrase-input")].map(e=>e.value||""); const resp=await db.queryOnce({players:{},phrases:{}}); const me=(resp.data.players||[]).find(p=>p.id===currentPlayerId||p.clientId===clientId); if(!me)return showMessage(formMsg,"No se pudo identificar tu jugador.",true); const existing=new Set((resp.data.phrases||[]).filter(ph=>ph.roomId===currentRoomId).map(ph=>ph.textNorm)); const val=validatePhraseInputs(inputs,existing); if(!val.ok)return showMessage(formMsg,val.error,true); let tx=tx.players[me.id].update({status:"ready"}); const now=Date.now(); for(const text of inputs){const phraseId=id(),authorId=id(); tx=tx.phrases[phraseId].update({roomId:currentRoomId,text:text.trim(),textNorm:normalizePhrase(text),originalAuthorId:me.id,currentOwnerId:null,visibility:"unassigned",status:"available",source:"player_setup",createdByPlayerId:me.id,createdAt:now}).phraseAuthors[authorId].update({roomId:currentRoomId,phraseId,playerId:me.id,authorType:"original",createdAt:now,active:true});} await db.transact(tx); await createLog(currentRoomId,`${me.name} cargó sus frases`); showMessage(formMsg,"Frases guardadas correctamente.",false);}
function canAdminStartGame(players){const act=players.filter(p=>p.status!=="left"&&p.status!=="kicked"); return act.length>=3&&act.every(p=>p.status==="ready");}
function shuffleArray(array){const arr=[...array]; for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr;}
async function dealPhrases(roomId){const resp=await db.queryOnce({players:{},phrases:{},phraseAuthors:{}}); const players=(resp.data.players||[]).filter(p=>p.roomId===roomId&&p.status!=="left"&&p.status!=="kicked"); const phrases=shuffleArray((resp.data.phrases||[]).filter(ph=>ph.roomId===roomId&&ph.source==="player_setup")); const authors=(resp.data.phraseAuthors||[]).filter(a=>a.roomId===roomId&&a.active); const need=players.length*8; if(phrases.length<need) throw new Error("No hay frases suficientes para repartir");
const assigned=new Set(); const updates=[];
for(const player of players){const owned=[]; for(const phrase of phrases){if(owned.length===8)break; if(assigned.has(phrase.id))continue; const authored=authors.some(a=>a.phraseId===phrase.id&&a.playerId===player.id&&a.active); if(authored||phrase.originalAuthorId===player.id)continue; owned.push(phrase); assigned.add(phrase.id);} if(owned.length<8) throw new Error(`Reparto imposible para ${player.name}`); owned.forEach((ph,idx)=>updates.push({phraseId:ph.id,playerId:player.id,visibility:idx<4?"visible":"hidden"}));}
if(updates.length!==need) throw new Error("Asignación incompleta"); return {players,updates};}
async function startGame(roomId){if(!roomId)return; try{const {players,updates}=await dealPhrases(roomId); let tx=tx.rooms[roomId].update({status:"playing"}); for(const p of players) tx=tx.players[p.id].update({status:"playing"}); for(const u of updates) tx=tx.phrases[u.phraseId].update({currentOwnerId:u.playerId,visibility:u.visibility,status:"available"}); await db.transact(tx); await createLog(roomId,"Partida iniciada"); await createLog(roomId,"Se repartieron las frases");}catch(e){console.error("No se pudo iniciar la partida:",e);}}
function getVisiblePhrases(playerId,phrases){return phrases.filter(ph=>ph.currentOwnerId===playerId&&ph.visibility==="visible"&&["available","pending_said"].includes(ph.status));}
async function closeRoomAsAdmin(){return closeRoom();}
function openLobby(){ui.home.classList.add("hidden");ui.flow.classList.add("hidden");ui.game.classList.add("hidden");ui.finished.classList.add("hidden");ui.lobby.classList.remove("hidden");}
function renderLobby(room,players,phrases){const me=players.find(p=>p.clientId===clientId||p.id===currentPlayerId); window.__lastMe=me; if(!me)return; currentPlayerId=me.id; ui.lobbyRoomName.textContent=`Sala: ${room.name}`; ui.lobbyMeta.textContent=`${players.length} jugador(es) en lobby`; ui.adminActions.classList.toggle("hidden",!me.isAdmin); ui.btnStartGame.disabled=!canAdminStartGame(players); renderMyPhraseStage(me,phrases); ui.playersList.innerHTML=getActivePlayers(players).sort((a,b)=>a.joinedAt-b.joinedAt).map(p=>`<li class="${p.status==="ready"?"ready-player":""}"><strong>${escapeHtml(p.name)}</strong>${p.isAdmin?'<span class="tag">Admin</span>':''}${p.clientId===clientId?'<span class="tag">Vos</span>':''}<div class="status">Estado: ${p.status}</div></li>`).join("");}
function renderGame(room,players,phrases,logs){ui.home.classList.add("hidden");ui.flow.classList.add("hidden");ui.lobby.classList.add("hidden");ui.game.classList.remove("hidden"); const me=players.find(p=>p.clientId===clientId||p.id===currentPlayerId); window.__lastMe=me; if(!me)return; currentPlayerId=me.id; ui.myPoints.textContent=`Puntos: ${me.points||0}`; const visible=getVisiblePhrases(me.id,phrases).slice(0,4); ui.copyMsg.classList.add("hidden"); ui.copyMsg.classList.remove("error","ok"); ui.visiblePhrases.innerHTML=visible.map(ph=>`<li><button class="phrase-card" data-id="${ph.id}">${escapeHtml(ph.text)}${ph.status==="pending_said"?`<div class="status">Pendiente: ${formatCountdown(ph.saidDeadlineAt)}</div>`:""}</button></li>`).join("")||"<li class='muted-box'>Sin frases visibles.</li>"; document.querySelectorAll('.phrase-card').forEach(btn=>{const pid=btn.getAttribute('data-id'); const phrase=visible.find(p=>p.id===pid); let timer; btn.onclick=()=>copyPhraseText(phrase); btn.oncontextmenu=(e)=>{e.preventDefault();openPhraseMenu(phrase)}; btn.ontouchstart=()=>{timer=setTimeout(()=>openPhraseMenu(phrase),550)}; btn.ontouchend=()=>clearTimeout(timer); btn.ontouchmove=()=>clearTimeout(timer);}); ui.gamePlayers.innerHTML=getActivePlayers(players).sort((a,b)=>a.joinedAt-b.joinedAt).map(p=>`<li><strong>${escapeHtml(p.name)}</strong>${p.isAdmin?'<span class="tag">Admin</span>':''}<div class="status">Estado: ${p.status}</div></li>`).join(""); const myPriv=(logs.filter(l=>l.visibility==="private"&&l.targetPlayerId===currentPlayerId).sort((a,b)=>b.createdAt-a.createdAt).slice(0,2)); const pub=(logs.filter(l=>l.visibility!=="private").sort((a,b)=>b.createdAt-a.createdAt).slice(0,3)); ui.recentLogs.innerHTML=[...pub.map(l=>`<li style="word-break:break-word">${escapeHtml(l.message||"Evento")}</li>`),...myPriv.map(l=>`<li style="border-left:3px solid #f59e0b;word-break:break-word"><strong>Solo vos:</strong> ${escapeHtml(l.message||"Evento")}</li>`)].join(""); renderOpenVotesPanel(players,room); renderPenaltyRequestsPanel(players);} 
function renderMyPhraseStage(me,phrases){const mine=phrases.filter(ph=>ph.originalAuthorId===me.id); if(me.status==="ready"||mine.length>=8){ui.myPhrasesBox.innerHTML='<div class="muted-box">Frases cargadas. Esperando al resto…</div>';return;} const inputs=Array.from({length:8}).map((_,i)=>`<div class="row"><label>Frase ${i+1}</label><input class="phrase-input" maxlength="180"></div>`).join(""); ui.myPhrasesBox.innerHTML=`<h3>Cargá tus 8 frases</h3><p>No se muestran al resto.</p>${inputs}<button id="btnSavePhrases" class="success">Guardar frases</button><div id="phrasesMsg" class="hidden"></div>`; document.getElementById("btnSavePhrases").onclick=savePlayerPhrases;}

async function copyPhraseText(phrase){if(!phrase)return; try{await navigator.clipboard.writeText(phrase.text);showMessage(ui.copyMsg,"Frase copiada",false);}catch{showMessage(ui.copyMsg,"No se pudo copiar",true);}}
function openPhraseMenu(phrase){selectedPhrase=phrase; ui.phraseMenuText.textContent=phrase.text; ui.phraseMenu.classList.remove("hidden"); ui.menuMsg.classList.add("hidden"); const mePoints=((window.__lastMe&&window.__lastMe.points)||0); const visibleCount=getVisiblePhraseCount(currentPlayerId); const blocked=phrase.status!=="available"; ui.btnSaid.disabled=blocked; ui.btnSwap.disabled=blocked; ui.btnRemoveWithPoints.disabled=!canRemovePhraseWithPoints(window.__lastMe||{points:0},phrase,visibleCount);}
function closePhraseMenu(){ui.phraseMenu.classList.add("hidden"); selectedPhrase=null;}
async function markPhraseAsSaid(phrase){if(phrase.status!=="available")return; const now=Date.now(); try{await db.transact(tx.phrases[phrase.id].update({status:"pending_said",saidByPlayerId:currentPlayerId,saidAt:now,saidDeadlineAt:now+300000})); closePhraseMenu();}catch(e){console.error(e);}}
async function swapPhrase(phrase){const resp=await db.queryOnce({phrases:{},players:{}}); const me=(resp.data.players||[]).find(p=>p.id===currentPlayerId); if(!me)return; if(me.swapsLeft<=0){showMessage(ui.menuMsg,"No te quedan intercambios.",true);return;} const mine=(resp.data.phrases||[]).filter(ph=>ph.currentOwnerId===currentPlayerId&&ph.status==="available"); const hidden=mine.filter(ph=>ph.visibility==="hidden"&&ph.id!==phrase.id); if(!hidden.length){showMessage(ui.menuMsg,"No tenés hidden para intercambiar.",true);return;} if(!confirm("Esta carta puede volver como penalización. ¿Continuar?"))return; const pick=hidden[Math.floor(Math.random()*hidden.length)]; await db.transact(tx.phrases[phrase.id].update({visibility:"hidden"}).phrases[pick.id].update({visibility:"visible"}).players[currentPlayerId].update({swapsLeft:me.swapsLeft-1})); showMessage(ui.menuMsg,`Intercambio realizado. Te quedan ${me.swapsLeft-1} intercambios.`,false);}
async function resolveExpiredSaidPhrases(){if(!currentRoomId)return; const rs=await db.queryOnce({rooms:{}}); const room=(rs.data.rooms||[]).find(r=>r.id===currentRoomId); if(room?.status!=="playing") return; const resp=await db.queryOnce({phrases:{},phraseAuthors:{},players:{}}); const now=Date.now(); const mine=(resp.data.phrases||[]).filter(ph=>ph.roomId===currentRoomId&&ph.currentOwnerId===currentPlayerId&&ph.status==="pending_said"&&ph.saidDeadlineAt<=now); for(const phrase of mine){const fresh=await db.queryOnce({phrases:{}}); const current=(fresh.data.phrases||[]).find(p=>p.id===phrase.id); if(!current||current.status!=="pending_said")continue; try{await db.transact(tx.phrases[phrase.id].update({visibility:"discarded",status:"success",discardedAt:Date.now()})); await awardAuthorPoints(current,resp.data.phraseAuthors||[],resp.data.players||[]); await checkForWinners();}catch(e){console.error("resolve duplicate",e);}}}
async function awardAuthorPoints(phrase,authors,players){const rel=authors.filter(a=>a.phraseId===phrase.id&&a.active); let tx=tx.logs[id()].update({roomId:currentRoomId,message:`${(players.find(p=>p.id===currentPlayerId)||{}).name||"Alguien"} logró meter un chamuyo: ${phrase.text}`,createdAt:Date.now(),visibility:"public"}); for(const a of rel){const pl=players.find(p=>p.id===a.playerId); if(!pl)continue; tx=tx.players[pl.id].update({points:(pl.points||0)+1}).logs[id()].update({roomId:currentRoomId,message:`Ganaste 1 punto porque ${(players.find(p=>p.id===currentPlayerId)||{}).name||"alguien"} metió una frase tuya.`,createdAt:Date.now(),visibility:"private",targetPlayerId:pl.id});} await db.transact(tx); await createVoteForSuccessfulPhrase(phrase);}
function formatCountdown(deadline){const ms=Math.max(0,(deadline||0)-Date.now()); const s=Math.floor(ms/1000); const m=Math.floor(s/60); const rs=s%60; return `${m}:${String(rs).padStart(2,"0")}`;}



function getRequiredVoteWeight(activePlayers){return Math.floor(activePlayers.length/2)+1;}
function getVoteWeight(player,requiredWeight){return player?.isAdmin?requiredWeight:1;}
async function createVoteForSuccessfulPhrase(phrase){const resp=await db.queryOnce({players:{}}); const players=(resp.data.players||[]).filter(p=>p.roomId===currentRoomId&&p.status!=="left"&&p.status!=="kicked"); const requiredWeight=getRequiredVoteWeight(players); await db.transact(tx.votes[id()].update({roomId:currentRoomId,targetPlayerId:phrase.saidByPlayerId||phrase.currentOwnerId,phraseId:phrase.id,status:"open",reason:"claimed_phrase_not_said_correctly",createdByPlayerId:phrase.saidByPlayerId||"system",createdAt:Date.now(),closedAt:null,yesWeight:0,requiredWeight}).logs[id()].update({roomId:currentRoomId,message:`Se abrió votación por el chamuyo de ${(players.find(p=>p.id===(phrase.saidByPlayerId||phrase.currentOwnerId))||{}).name||"jugador"}.`,visibility:"public",createdAt:Date.now()}));}
async function castPenaltyVote(vote){const resp=await db.queryOnce({voteBallots:{},players:{},votes:{},phrases:{},logs:{}}); const players=(resp.data.players||[]).filter(p=>p.roomId===currentRoomId); const me=players.find(p=>p.id===currentPlayerId); const fresh=(resp.data.votes||[]).find(v=>v.id===vote.id); if(!me||!fresh||fresh.status!=="open"||fresh.targetPlayerId===me.id)return; if((resp.data.voteBallots||[]).some(b=>b.voteId===vote.id&&b.voterPlayerId===me.id))return;
const required=fresh.requiredWeight||getRequiredVoteWeight(players.filter(p=>p.status!=="left"&&p.status!=="kicked")); const w=getVoteWeight(me,required); const newWeight=(fresh.yesWeight||0)+w; let tx=tx.voteBallots[id()].update({roomId:currentRoomId,voteId:vote.id,voterPlayerId:me.id,weight:w,choice:"yes",createdAt:Date.now()}).votes[vote.id].update({yesWeight:newWeight});
if(newWeight>=required){tx=tx.votes[vote.id].update({status:"passed",closedAt:Date.now()}).logs[id()].update({roomId:currentRoomId,message:`La votación contra ${(players.find(p=>p.id===fresh.targetPlayerId)||{}).name||"jugador"} fue aprobada.`,visibility:"public",createdAt:Date.now()}).logs[id()].update({roomId:currentRoomId,message:"Fuiste penalizado por votación.",visibility:"private",targetPlayerId:fresh.targetPlayerId,createdAt:Date.now()});}
await db.transact(tx); if(newWeight>=required) await applyVotePenalty(fresh.targetPlayerId); await checkForWinners();
}
async function applyVotePenalty(targetPlayerId){const resp=await db.queryOnce({players:{},phrases:{},rooms:{}}); const room=(resp.data.rooms||[]).find(r=>r.id===currentRoomId); const hidden=(resp.data.phrases||[]).filter(ph=>ph.roomId===currentRoomId&&ph.currentOwnerId===targetPlayerId&&ph.visibility==="hidden"&&ph.status==="available"); let tx=app.tx; if(hidden.length>=2){for(const h of shuffleArray(hidden).slice(0,2)){tx=tx.phrases[h.id].update({visibility:"visible"});}} else if(hidden.length===1){tx=tx.phrases[hidden[0].id].update({visibility:"visible"});} else {tx=tx.penaltyPhraseRequests[id()].update({roomId:currentRoomId,requesterPlayerId:room?.adminPlayerId||targetPlayerId,targetPlayerId,reason:"vote_penalty",status:"pending",createdAt:Date.now(),deadlineAt:Date.now()+300000});}
await db.transact(tx);
}
async function closeVoteWithoutPenalty(vote){const resp=await db.queryOnce({players:{},votes:{}}); const me=(resp.data.players||[]).find(p=>p.id===currentPlayerId); const fresh=(resp.data.votes||[]).find(v=>v.id===vote.id); if(!me?.isAdmin||!fresh||fresh.status!=="open")return; await db.transact(tx.votes[vote.id].update({status:"cancelled",closedAt:Date.now()}).logs[id()].update({roomId:currentRoomId,message:`La votación contra ${((resp.data.players||[]).find(p=>p.id===vote.targetPlayerId)||{}).name||"jugador"} fue cerrada sin penalización.`,visibility:"public",createdAt:Date.now()}));}
function renderOpenVotesPanel(players,room){db.queryOnce({votes:{},voteBallots:{},phrases:{}}).then(r=>{const votes=(r.data.votes||[]).filter(v=>v.roomId===currentRoomId&&v.status==="open"); if(!votes.length){ui.openVotesPanel.innerHTML="";return;} ui.openVotesPanel.innerHTML=`<h3>Votaciones abiertas</h3>${votes.map(v=>{const phrase=(r.data.phrases||[]).find(p=>p.id===v.phraseId)||{}; const target=players.find(p=>p.id===v.targetPlayerId)||{}; const voted=(r.data.voteBallots||[]).some(b=>b.voteId===v.id&&b.voterPlayerId===currentPlayerId); const me=players.find(p=>p.id===currentPlayerId); const canVote=!voted&&currentPlayerId!==v.targetPlayerId; return `<div class="muted-box"><div><strong>${escapeHtml(target.name||"Jugador")}</strong></div><div class="status">${escapeHtml(phrase.text||"(frase)")}</div><div class="status">${v.yesWeight||0} / ${v.requiredWeight||0}</div><div class="stack"><button ${canVote?"":"disabled"} data-vote="${v.id}">Votar penalización</button>${me?.isAdmin?`<button class="secondary" data-closevote="${v.id}">Cerrar sin penalizar</button>`:""}</div></div>`;}).join("")}`; document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>castPenaltyVote(votes.find(v=>v.id===b.getAttribute('data-vote')))); document.querySelectorAll('[data-closevote]').forEach(b=>b.onclick=()=>closeVoteWithoutPenalty(votes.find(v=>v.id===b.getAttribute('data-closevote'))));});}

function getVisiblePhraseCount(playerId){const cards=[...document.querySelectorAll(".phrase-card")]; return cards.length;}
function canRemovePhraseWithPoints(player,phrase,visibleCount){if(!player)return false; if((player.points||0)<2) return false; if(visibleCount<=1) return false; if(phrase.status==="pending_said") return false; if(phrase.visibility!=="visible") return false; return true;}
async function removePhraseWithPoints(phrase){const resp=await db.queryOnce({players:{},phrases:{}}); const me=(resp.data.players||[]).find(p=>p.id===currentPlayerId); if(!me)return; const visibleCount=(resp.data.phrases||[]).filter(ph=>ph.roomId===currentRoomId&&ph.currentOwnerId===currentPlayerId&&ph.visibility==="visible"&&ph.status!=="removed").length; if(!canRemovePhraseWithPoints(me,phrase,visibleCount)){return showMessage(ui.menuMsg,"No podés eliminar esta carta ahora.",true);} if(!confirm("Esta carta se elimina definitivamente del juego. ¿Confirmás?"))return; const now=Date.now(); await db.transact(tx.players[currentPlayerId].update({points:(me.points||0)-2}).phrases[phrase.id].update({visibility:"removed",status:"removed",removedAt:now,currentOwnerId:currentPlayerId}).logs[id()].update({roomId:currentRoomId,message:"Usaste 2 puntos para eliminar una carta.",visibility:"private",targetPlayerId:currentPlayerId,createdAt:now}).logs[id()].update({roomId:currentRoomId,message:`${me.name} eliminó una carta usando puntos.`,visibility:"public",createdAt:now})); await checkForWinners(); closePhraseMenu();}

function openUserMenu(target,myPlayer){selectedAccusedId=target?.id; if(!selectedAccusedId)return; ui.userMenuTitle.textContent=`Acciones sobre ${target.name}`; ui.btnKickUser.classList.toggle("hidden",!myPlayer?.isAdmin); ui.userMenu.classList.remove("hidden");}
function closeUserMenu(){ui.userMenu.classList.add("hidden");}
function openChallengeModal(){if(!selectedAccusedId)return; ui.challengeInput.value=""; ui.challengeMsg.classList.add("hidden"); ui.challengeModal.classList.remove("hidden"); closeUserMenu();}
function closeChallengeModal(){ui.challengeModal.classList.add("hidden");}
async function confirmChallenge(){const pasted=ui.challengeInput.value.trim(); if(!pasted)return showMessage(ui.challengeMsg,"Pegá una frase para denunciar.",true); const pastedNorm=normalizePhrase(pasted); const resp=await db.queryOnce({players:{},phrases:{},phraseAuthors:{}}); const players=(resp.data.players||[]).filter(p=>p.roomId===currentRoomId); const me=players.find(p=>p.id===currentPlayerId); const accused=players.find(p=>p.id===selectedAccusedId); if(!me||!accused)return; const phrases=(resp.data.phrases||[]).filter(ph=>ph.roomId===currentRoomId && ph.currentOwnerId===accused.id && ["visible","hidden"].includes(ph.visibility) && ["available","pending_said"].includes(ph.status)); const match=phrases.find(ph=>ph.textNorm===pastedNorm); const now=Date.now(); if(match){const authored=(resp.data.phraseAuthors||[]).some(a=>a.phraseId===match.id&&a.playerId===me.id&&a.active); if(authored){return showMessage(ui.challengeMsg,"No podés denunciar una carta de tu autoría.",true);} await applyCorrectChallenge(me,accused,match,pasted,pastedNorm,resp.data); closeChallengeModal(); return;} await applyFalseChallenge(me,accused,pasted,pastedNorm,resp.data); closeChallengeModal();}
async function applyCorrectChallenge(me,accused,match,pasted,pastedNorm,data){const now=Date.now(); const challengeId=id(); const accHidden=(data.phrases||[]).filter(ph=>ph.roomId===currentRoomId&&ph.currentOwnerId===accused.id&&ph.visibility==="hidden"&&ph.status==="available"); let tx=tx.challenges[challengeId].update({roomId:currentRoomId,accuserPlayerId:me.id,accusedPlayerId:accused.id,pastedText:pasted,pastedTextNorm:pastedNorm,result:"correct",matchedPhraseId:match.id,createdAt:now,resolvedAt:now}).players[me.id].update({points:(me.points||0)+1}).logs[id()].update({roomId:currentRoomId,message:`${me.name} denunció correctamente un chamuyo de ${accused.name}.`,visibility:"public",createdAt:now}).logs[id()].update({roomId:currentRoomId,message:"Ganaste 1 punto por denuncia correcta.",visibility:"private",targetPlayerId:me.id,createdAt:now});
if(accHidden.length>=2){const chosen=shuffleArray(accHidden).slice(0,2); tx=tx.phrases[match.id].update({visibility:"discarded",status:"caught",discardedAt:now,saidDeadlineAt:null}); for(const h of chosen){tx=tx.phrases[h.id].update({visibility:"visible"});}}
else if(accHidden.length===1){tx=tx.phrases[match.id].update({status:"available",saidDeadlineAt:null}); tx=tx.phrases[accHidden[0].id].update({visibility:"visible"});}
else {const reqId=id(); tx=tx.penaltyPhraseRequests[reqId].update({roomId:currentRoomId,requesterPlayerId:me.id,targetPlayerId:accused.id,reason:"correct_challenge_no_hidden",status:"pending",createdAt:now,deadlineAt:now+300000}).phrases[match.id].update({status:"available",saidDeadlineAt:null});}
await db.transact(tx);}
async function applyFalseChallenge(me,accused,pasted,pastedNorm,data){const now=Date.now(); const myHidden=(data.phrases||[]).filter(ph=>ph.roomId===currentRoomId&&ph.currentOwnerId===me.id&&ph.visibility==="hidden"&&ph.status==="available"); let tx=tx.challenges[id()].update({roomId:currentRoomId,accuserPlayerId:me.id,accusedPlayerId:accused.id,pastedText:pasted,pastedTextNorm:pastedNorm,result:"false",createdAt:now,resolvedAt:now}).logs[id()].update({roomId:currentRoomId,message:`${me.name} hizo una denuncia falsa contra ${accused.name}.`,visibility:"public",createdAt:now});
if(myHidden.length){const reveal=myHidden[Math.floor(Math.random()*myHidden.length)]; tx=tx.phrases[reveal.id].update({visibility:"visible"}).logs[id()].update({roomId:currentRoomId,message:"Penalización: recibiste una carta visible.",visibility:"private",targetPlayerId:me.id,createdAt:now});}
else if((me.points||0)>0){tx=tx.players[me.id].update({points:me.points-1}).logs[id()].update({roomId:currentRoomId,message:"Penalización: perdiste 1 punto.",visibility:"private",targetPlayerId:me.id,createdAt:now});}
else{tx=tx.penaltyPhraseRequests[id()].update({roomId:currentRoomId,requesterPlayerId:accused.id,targetPlayerId:me.id,reason:"false_challenge",status:"pending",createdAt:now,deadlineAt:now+300000}).logs[id()].update({roomId:currentRoomId,message:`${accused.name} debe escribir una frase nueva para vos.`,visibility:"private",targetPlayerId:me.id,createdAt:now});}
await db.transact(tx);}
function renderPenaltyRequestsPanel(players){if(!currentRoomId)return; db.queryOnce({penaltyPhraseRequests:{},phrases:{},phraseAuthors:{}}).then(async r=>{const reqs=(r.data.penaltyPhraseRequests||[]).filter(x=>x.roomId===currentRoomId&&x.status==="pending"&&x.requesterPlayerId===currentPlayerId); if(!reqs.length){ui.penaltyPanel.innerHTML="";return;} ui.penaltyPanel.innerHTML=reqs.map(req=>`<div class="muted-box"><strong>Penalización pendiente</strong><div class="status">Escribí una frase para ${escapeHtml((players.find(p=>p.id===req.targetPlayerId)||{}).name||"jugador")}. Tiempo: ${formatCountdown(req.deadlineAt)}</div><input class="input" id="penalty_${req.id}" placeholder="Escribí frase..."><button class="success" data-req="${req.id}">Guardar frase penalización</button></div>`).join(""); document.querySelectorAll("[data-req]").forEach(btn=>btn.onclick=()=>submitPenaltyPhrase(btn.getAttribute("data-req"),r.data));});}
async function submitPenaltyPhrase(reqId,data){const req=(data.penaltyPhraseRequests||[]).find(x=>x.id===reqId); if(!req)return; const input=document.getElementById(`penalty_${req.id}`); const text=(input?.value||"").trim(); if(!text)return; const textNorm=normalizePhrase(text); const all=(await db.queryOnce({phrases:{}})).data.phrases||[]; if(all.some(ph=>ph.roomId===currentRoomId&&ph.textNorm===textNorm)) return alert("Esa frase ya existe en la sala."); const phraseId=id(),authorId=id(),now=Date.now(); let tx=tx.phrases[phraseId].update({roomId:currentRoomId,text,textNorm,originalAuthorId:req.requesterPlayerId,currentOwnerId:req.targetPlayerId,visibility:"visible",status:"available",source:"penalty",createdByPlayerId:req.requesterPlayerId,createdAt:now,assignedAt:now}).phraseAuthors[authorId].update({roomId:currentRoomId,phraseId,playerId:req.requesterPlayerId,authorType:"original",createdAt:now,active:true}).penaltyPhraseRequests[req.id].update({status:"completed",resolvedAt:now}); await db.transact(tx);} 
async function resolveExpiredPenaltyRequests(){if(!currentRoomId)return; const r=await db.queryOnce({penaltyPhraseRequests:{}}); const now=Date.now(); for(const req of (r.data.penaltyPhraseRequests||[]).filter(x=>x.roomId===currentRoomId&&x.status==="pending"&&x.deadlineAt<=now)){try{await db.transact(tx.penaltyPhraseRequests[req.id].update({status:"expired",resolvedAt:now}));}catch{}}}


function getActivePlayers(players){return (players||[]).filter(p=>!["kicked","left"].includes(p.status));}
async function deactivatePlayerAuthorship(playerId){const resp=await db.queryOnce({phraseAuthors:{}}); let tx=app.tx; for(const a of (resp.data.phraseAuthors||[]).filter(a=>a.roomId===currentRoomId&&a.playerId===playerId&&a.active)){tx=tx.phraseAuthors[a.id].update({active:false});} await db.transact(tx);}
async function redistributePlayerPhrases(playerId){const resp=await db.queryOnce({players:{},phrases:{},phraseAuthors:{}}); const players=(resp.data.players||[]).filter(p=>p.roomId===currentRoomId); const candidates=getActivePlayers(players).filter(p=>p.status==="playing"&&p.id!==playerId); let tx=app.tx; const mine=(resp.data.phrases||[]).filter(ph=>ph.roomId===currentRoomId&&ph.currentOwnerId===playerId&&["visible","hidden"].includes(ph.visibility)&&["available","pending_said"].includes(ph.status));
for(const ph of mine){const valid=candidates.filter(c=>!(resp.data.phraseAuthors||[]).some(a=>a.phraseId===ph.id&&a.playerId===c.id&&a.active)); if(!valid.length){tx=tx.phrases[ph.id].update({visibility:"discarded",status:"discarded",currentOwnerId:null,saidDeadlineAt:null}); continue;} const pick=valid[Math.floor(Math.random()*valid.length)]; tx=tx.phrases[ph.id].update({currentOwnerId:pick.id,visibility:"hidden",status:"available",saidDeadlineAt:null});}
await db.transact(tx);}
async function cancelRelatedOpenItems(playerId){const r=await db.queryOnce({votes:{},penaltyPhraseRequests:{}}); let tx=app.tx; for(const v of (r.data.votes||[]).filter(v=>v.roomId===currentRoomId&&v.status==="open"&&(v.targetPlayerId===playerId))){tx=tx.votes[v.id].update({status:"cancelled",closedAt:Date.now()});} for(const pr of (r.data.penaltyPhraseRequests||[]).filter(pr=>pr.roomId===currentRoomId&&pr.status==="pending"&&(pr.requesterPlayerId===playerId||pr.targetPlayerId===playerId))){tx=tx.penaltyPhraseRequests[pr.id].update({status:"cancelled",resolvedAt:Date.now()});} await db.transact(tx);}
async function ensureMinimumPlayersOrClose(){const r=await db.queryOnce({players:{},rooms:{}}); const room=(r.data.rooms||[]).find(x=>x.id===currentRoomId); const active=getActivePlayers((r.data.players||[]).filter(p=>p.roomId===currentRoomId&&p.status==="playing")); if(room?.status==="playing"&&active.length<3){await db.transact(tx.rooms[currentRoomId].update({status:"closed",closedAt:Date.now()}).logs[id()].update({roomId:currentRoomId,message:"La partida se cerró por falta de jugadores.",visibility:"public",createdAt:Date.now()}));}}
async function kickPlayer(playerId){const r=await db.queryOnce({players:{},rooms:{}}); const players=(r.data.players||[]).filter(p=>p.roomId===currentRoomId); const me=players.find(p=>p.id===currentPlayerId); const target=players.find(p=>p.id===playerId); const room=(r.data.rooms||[]).find(x=>x.id===currentRoomId); if(!me?.isAdmin||!target||target.id===me.id)return; if(!confirm(`¿Seguro que querés echar a ${target.name}?`))return; if(!confirm("Esto no se puede deshacer. ¿Confirmás?"))return; await db.transact(tx.players[target.id].update({status:"kicked",kickedAt:Date.now()}).logs[id()].update({roomId:currentRoomId,message:`${target.name} fue expulsado de la sala.`,visibility:"public",createdAt:Date.now()})); await deactivatePlayerAuthorship(target.id); await cancelRelatedOpenItems(target.id); if(room?.status==="playing") await redistributePlayerPhrases(target.id); await ensureMinimumPlayersOrClose(); closeUserMenu();}
async function closeRoom(){const r=await db.queryOnce({players:{}}); const me=(r.data.players||[]).find(p=>p.id===currentPlayerId); if(!me?.isAdmin)return; if(!confirm("¿Cerrar esta sala para todos?"))return; await db.transact(tx.rooms[currentRoomId].update({status:"closed",closedAt:Date.now()}).logs[id()].update({roomId:currentRoomId,message:"La sala fue cerrada por el administrador.",visibility:"public",createdAt:Date.now()}));}
async function leaveRoom(){const r=await db.queryOnce({players:{},rooms:{}}); const players=(r.data.players||[]).filter(p=>p.roomId===currentRoomId); const me=players.find(p=>p.id===currentPlayerId); const room=(r.data.rooms||[]).find(x=>x.id===currentRoomId); if(!me)return; if(me.isAdmin){if(confirm("Si salís, se cierra la sala para todos.")){await closeRoom();} return;} await db.transact(tx.players[me.id].update({status:"left",leftAt:Date.now()}).logs[id()].update({roomId:currentRoomId,message:`${me.name} salió de la sala.`,visibility:"public",createdAt:Date.now()})); await deactivatePlayerAuthorship(me.id); await cancelRelatedOpenItems(me.id); if(room?.status==="playing") await redistributePlayerPhrases(me.id); await ensureMinimumPlayersOrClose(); resetToHome();}


function getActiveVisiblePhrases(playerId,phrases){return (phrases||[]).filter(ph=>ph.currentOwnerId===playerId&&ph.visibility==="visible"&&! ["removed","discarded","success","caught"].includes(ph.status));}
async function checkForWinners(){const r=await db.queryOnce({rooms:{},players:{},phrases:{}}); const room=(r.data.rooms||[]).find(x=>x.id===currentRoomId); if(!room||room.status!=="playing")return; const players=getActivePlayers((r.data.players||[]).filter(p=>p.roomId===currentRoomId)); const winners=players.filter(p=>getActiveVisiblePhrases(p.id,r.data.phrases||[]).length===0).map(p=>({playerId:p.id,name:p.name})); if(winners.length) await finishGame(winners,room);}
async function cancelOpenVotes(reason){const r=await db.queryOnce({votes:{}}); let tx=app.tx; for(const v of (r.data.votes||[]).filter(v=>v.roomId===currentRoomId&&v.status==="open")){tx=tx.votes[v.id].update({status:"cancelled",closedAt:Date.now(),cancelReason:reason});} await db.transact(tx);}
async function cancelPendingPenaltyRequests(reason){const r=await db.queryOnce({penaltyPhraseRequests:{}}); let tx=app.tx; for(const pr of (r.data.penaltyPhraseRequests||[]).filter(pr=>pr.roomId===currentRoomId&&pr.status==="pending")){tx=tx.penaltyPhraseRequests[pr.id].update({status:"cancelled",resolvedAt:Date.now(),cancelReason:reason});} await db.transact(tx);}
async function finishGame(winners,room){if(!room||room.status!=="playing")return; const text=winners.length===1?`${winners[0].name} ganó la partida.`:`${winners.map(w=>w.name).join(", ")} ganaron la partida.`; await db.transact(tx.rooms[currentRoomId].update({status:"finished",finishedAt:Date.now(),winnersJson:JSON.stringify(winners)}).logs[id()].update({roomId:currentRoomId,message:text,visibility:"public",createdAt:Date.now()})); await cancelOpenVotes("game_finished"); await cancelPendingPenaltyRequests("game_finished");}
function renderFinishedScreen(room){ui.home.classList.add("hidden");ui.flow.classList.add("hidden");ui.lobby.classList.add("hidden");ui.game.classList.add("hidden");ui.finished.classList.remove("hidden"); let winners=[]; try{winners=JSON.parse(room.winnersJson||"[]");}catch{} ui.finishedWinners.textContent=winners.length?`Ganadores: ${winners.map(w=>w.name).join(", ")}`:"Sin ganadores";}

function normalizePhrase(text){let v=(text||"").trim().toLowerCase(); v=v.normalize("NFD").replace(/[\u0300-\u036f]/g,""); v=v.replace(/^['"“”‘’]+/,"").replace(/['"“”‘’]+$/,""); v=v.replace(/[\.,;:!?]+$/g,""); return v.trim();}
async function createLog(roomId,message){try{await db.transact(tx.logs[id()].update({roomId,message,createdAt:Date.now(),visibility:"public"}));}catch{}}
function resetToHome(){currentRoomId=null;currentPlayerId=null;ui.flow.classList.add("hidden");ui.lobby.classList.add("hidden");ui.game.classList.add("hidden");ui.finished.classList.add("hidden");ui.home.classList.remove("hidden");}
function getOrCreateClientId(){let x=localStorage.getItem(CLIENT_ID_KEY); if(!x){x=crypto.randomUUID();localStorage.setItem(CLIENT_ID_KEY,x);} return x;}
const norm=(t)=> (t||"").trim().toLowerCase(); const readInput=(id)=>document.getElementById(id).value.trim();
function showMessage(el,text,isError){el.classList.remove("hidden","error","ok");el.classList.add(isError?"error":"ok");el.textContent=text;}
function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
</script></body></html>
