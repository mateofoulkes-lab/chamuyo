<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamuyo - Prototipo</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #22c55e;
        --danger: #ef4444;
        --border: #334155;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(180deg, #0b1022 0%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
      }

      .app {
        width: min(100%, 680px);
        margin: 0 auto;
        padding: 16px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
      }

      .logo-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
      }

      .logo {
        max-width: 180px;
        width: 60%;
        height: auto;
      }

      h1, h2, h3 { margin: 0 0 12px; }

      p { color: var(--muted); margin: 0 0 10px; }

      .stack { display: grid; gap: 12px; }

      button {
        width: 100%;
        min-height: 52px;
        border: none;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
        background: #2563eb;
      }

      button.secondary { background: #374151; }
      button.success { background: var(--accent); color: #052e16; }
      button.danger { background: var(--danger); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .input {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-soft);
        color: var(--text);
        padding: 10px 12px;
        font-size: 1rem;
      }

      .row {
        display: grid;
        gap: 8px;
      }

      .players { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
      .players li {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        background: #0b1220;
      }

      .tag {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        background: #14532d;
        color: #dcfce7;
      }

      .status { color: var(--muted); font-size: 0.9rem; }
      .error { color: #fecaca; background: #7f1d1d; padding: 8px 10px; border-radius: 8px; }
      .ok { color: #dcfce7; background: #14532d; padding: 8px 10px; border-radius: 8px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <main class="app">
      <section id="home" class="card stack">
        <div class="logo-wrap">
          <img class="logo" src="logo.png" alt="Logo Chamuyo" />
        </div>
        <button id="btnCreateRoom">Crear sala</button>
        <button id="btnJoinRoom" class="secondary">Unirse a sala</button>
        <button disabled>Crear/editar listas (próximamente)</button>
        <div id="homeMsg" class="hidden"></div>
      </section>

      <section id="flow" class="card stack hidden"></section>

      <section id="lobby" class="card stack hidden">
        <h2 id="lobbyRoomName">Lobby</h2>
        <p id="lobbyMeta"></p>
        <ul id="playersList" class="players"></ul>
        <div id="adminActions" class="stack hidden">
          <button disabled>Iniciar partida (próximamente)</button>
          <button id="btnCloseRoom" class="danger">Cerrar sala</button>
        </div>
      </section>
    </main>

    <script type="module">
      import { init } from "https://esm.sh/@instantdb/browser";

      // Pegá acá tu App ID de InstantDB
      const APP_ID = "REEMPLAZAR_CON_TU_APP_ID";

      const app = init({ appId: APP_ID });

      const CLIENT_ID_KEY = "chamuyo_client_id";
      const clientId = getOrCreateClientId();

      const ui = {
        home: document.getElementById("home"),
        flow: document.getElementById("flow"),
        lobby: document.getElementById("lobby"),
        homeMsg: document.getElementById("homeMsg"),
        btnCreateRoom: document.getElementById("btnCreateRoom"),
        btnJoinRoom: document.getElementById("btnJoinRoom"),
        lobbyRoomName: document.getElementById("lobbyRoomName"),
        lobbyMeta: document.getElementById("lobbyMeta"),
        playersList: document.getElementById("playersList"),
        adminActions: document.getElementById("adminActions"),
        btnCloseRoom: document.getElementById("btnCloseRoom"),
      };

      let currentRoomId = null;
      let currentPlayerId = null;

      ui.btnCreateRoom.addEventListener("click", showCreateRoomFlow);
      ui.btnJoinRoom.addEventListener("click", showJoinRoomFlow);
      ui.btnCloseRoom.addEventListener("click", closeRoomAsAdmin);

      // Suscripción reactiva al lobby (sala y jugadores)
      app.subscribeQuery({
        rooms: {},
        players: {},
      }, (resp) => {
        if (resp?.error || !currentRoomId) return;
        const room = (resp.data.rooms || []).find((r) => r.id === currentRoomId);
        const players = (resp.data.players || []).filter((p) => p.roomId === currentRoomId);

        if (!room || room.status === "closed") {
          showMessage(ui.homeMsg, "La sala se cerró.", true);
          resetToHome();
          return;
        }

        renderLobby(room, players);
      });

      function showCreateRoomFlow() {
        ui.home.classList.add("hidden");
        ui.lobby.classList.add("hidden");
        ui.flow.classList.remove("hidden");
        ui.flow.innerHTML = `
          <h2>Crear sala</h2>
          <div class="row"><label>Nombre de sala</label><input id="roomName" class="input" maxlength="30" /></div>
          <div class="row"><label>Contraseña</label><input id="roomPass" class="input" type="password" maxlength="30" /></div>
          <div class="row"><label>Tu nombre de jugador</label><input id="playerName" class="input" maxlength="24" /></div>
          <button id="submitCreate" class="success">Crear y entrar</button>
          <button id="cancelFlow" class="secondary">Cancelar</button>
          <div id="flowMsg" class="hidden"></div>
        `;

        document.getElementById("submitCreate").onclick = createRoomAndAdmin;
        document.getElementById("cancelFlow").onclick = resetToHome;
      }

      function showJoinRoomFlow() {
        ui.home.classList.add("hidden");
        ui.lobby.classList.add("hidden");
        ui.flow.classList.remove("hidden");
        ui.flow.innerHTML = `
          <h2>Unirse a sala</h2>
          <div class="row"><label>Nombre de sala</label><input id="roomName" class="input" maxlength="30" /></div>
          <div class="row"><label>Contraseña</label><input id="roomPass" class="input" type="password" maxlength="30" /></div>
          <div class="row"><label>Tu nombre de jugador</label><input id="playerName" class="input" maxlength="24" /></div>
          <button id="submitJoin" class="success">Entrar</button>
          <button id="cancelFlow" class="secondary">Cancelar</button>
          <div id="flowMsg" class="hidden"></div>
        `;

        document.getElementById("submitJoin").onclick = joinRoom;
        document.getElementById("cancelFlow").onclick = resetToHome;
      }

      // Crea sala + crea jugador admin
      async function createRoomAndAdmin() {
        const roomName = readInput("roomName");
        const password = readInput("roomPass");
        const playerName = readInput("playerName");
        const msg = document.getElementById("flowMsg");

        if (!roomName || !password || !playerName) {
          return showMessage(msg, "Completá todos los campos.", true);
        }

        const roomId = crypto.randomUUID();
        const playerId = crypto.randomUUID();
        const now = Date.now();

        const tx = app.tx.rooms[roomId].update({
          name: roomName,
          nameNorm: norm(roomName),
          password,
          status: "lobby",
          createdAt: now,
          adminPlayerId: playerId,
        }).players[playerId].update({
          roomId,
          name: playerName,
          nameNorm: norm(playerName),
          isAdmin: true,
          status: "ready",
          joinedAt: now,
          points: 0,
          swapsLeft: 2,
          clientId,
        });

        try {
          await app.transact(tx);
          currentRoomId = roomId;
          currentPlayerId = playerId;
          showMessage(msg, "Sala creada.", false);
          openLobby();
        } catch (e) {
          showMessage(msg, "Error creando sala.", true);
        }
      }

      // Busca sala por nombre+pass, valida duplicados, crea jugador
      async function joinRoom() {
        const roomName = readInput("roomName");
        const password = readInput("roomPass");
        const playerName = readInput("playerName");
        const msg = document.getElementById("flowMsg");

        if (!roomName || !password || !playerName) {
          return showMessage(msg, "Completá todos los campos.", true);
        }

        try {
          const resp = await app.queryOnce({ rooms: {}, players: {} });
          const rooms = resp.data.rooms || [];
          const players = resp.data.players || [];
          const room = rooms.find((r) => r.nameNorm === norm(roomName) && r.status !== "closed");

          if (!room) return showMessage(msg, "Sala no encontrada.", true);
          if (room.password !== password) return showMessage(msg, "Contraseña incorrecta.", true);

          const duplicated = players.some(
            (p) => p.roomId === room.id && p.nameNorm === norm(playerName) && p.status !== "left" && p.status !== "kicked"
          );
          if (duplicated) return showMessage(msg, "Ese nombre ya está en uso en la sala.", true);

          const playerId = crypto.randomUUID();
          await app.transact(
            app.tx.players[playerId].update({
              roomId: room.id,
              name: playerName,
              nameNorm: norm(playerName),
              isAdmin: false,
              status: "ready",
              joinedAt: Date.now(),
              points: 0,
              swapsLeft: 2,
              clientId,
            })
          );

          currentRoomId = room.id;
          currentPlayerId = playerId;
          openLobby();
        } catch (e) {
          showMessage(msg, "Error al unirse.", true);
        }
      }

      // Cierra sala (elimina sala + jugadores asociados)
      async function closeRoomAsAdmin() {
        if (!currentRoomId || !currentPlayerId) return;

        try {
          const resp = await app.queryOnce({ rooms: {}, players: {} });
          const room = (resp.data.rooms || []).find((r) => r.id === currentRoomId);
          const me = (resp.data.players || []).find((p) => p.id === currentPlayerId);
          if (!room || !me?.isAdmin) return;

          let tx = app.tx.rooms[currentRoomId].delete();
          for (const p of (resp.data.players || []).filter((x) => x.roomId === currentRoomId)) {
            tx = tx.players[p.id].delete();
          }
          await app.transact(tx);
          showMessage(ui.homeMsg, "Sala cerrada.", false);
          resetToHome();
        } catch (e) {
          // Fallback: si falla eliminar, marcar cerrada
          try {
            await app.transact(app.tx.rooms[currentRoomId].update({ status: "closed" }));
            resetToHome();
          } catch {
            alert("No se pudo cerrar la sala.");
          }
        }
      }

      function openLobby() {
        ui.home.classList.add("hidden");
        ui.flow.classList.add("hidden");
        ui.lobby.classList.remove("hidden");
      }

      function renderLobby(room, players) {
        const me = players.find((p) => p.clientId === clientId || p.id === currentPlayerId);
        const iAmAdmin = Boolean(me?.isAdmin);

        ui.lobbyRoomName.textContent = `Sala: ${room.name}`;
        ui.lobbyMeta.textContent = `${players.length} jugador(es) en lobby`;
        ui.adminActions.classList.toggle("hidden", !iAmAdmin);

        ui.playersList.innerHTML = players
          .sort((a, b) => a.joinedAt - b.joinedAt)
          .map((p) => {
            const adminTag = p.isAdmin ? `<span class="tag">Admin</span>` : "";
            const meTag = p.clientId === clientId ? `<span class="tag">Vos</span>` : "";
            return `<li><strong>${escapeHtml(p.name)}</strong> ${adminTag} ${meTag}<div class="status">Estado: ${p.status}</div></li>`;
          })
          .join("");
      }

      function resetToHome() {
        currentRoomId = null;
        currentPlayerId = null;
        ui.flow.classList.add("hidden");
        ui.lobby.classList.add("hidden");
        ui.home.classList.remove("hidden");
      }

      function getOrCreateClientId() {
        let id = localStorage.getItem(CLIENT_ID_KEY);
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem(CLIENT_ID_KEY, id);
        }
        return id;
      }

      function norm(text) {
        return (text || "").trim().toLowerCase();
      }

      function readInput(id) {
        return document.getElementById(id).value.trim();
      }

      function showMessage(el, text, isError) {
        el.classList.remove("hidden", "error", "ok");
        el.classList.add(isError ? "error" : "ok");
        el.textContent = text;
      }

      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
