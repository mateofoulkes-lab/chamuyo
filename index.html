<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chamuyo - Prototipo</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--panel-soft:#1f2937;--text:#f8fafc;--muted:#cbd5e1;--accent:#22c55e;--danger:#ef4444;--border:#334155}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#0b1022 0%,var(--bg) 100%);color:var(--text);min-height:100vh}
.app{width:min(100%,720px);margin:0 auto;padding:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
.logo{max-width:180px;width:60%;height:auto}.logo-sm{max-width:90px;width:40%}.stack{display:grid;gap:12px}.row{display:grid;gap:8px}
button{width:100%;min-height:52px;border:none;border-radius:12px;padding:12px 14px;font-size:1rem;font-weight:700;cursor:pointer;color:#fff;background:#2563eb}
button.secondary{background:#374151}button.success{background:var(--accent);color:#052e16}button.danger{background:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}
.input,.phrase-input{width:100%;min-height:48px;border:1px solid var(--border);border-radius:10px;background:var(--panel-soft);color:var(--text);padding:10px 12px;font-size:1rem}
.players,.phrases{list-style:none;padding:0;margin:0;display:grid;gap:8px}.players li,.phrase-card{border:1px solid var(--border);border-radius:10px;padding:10px;background:#0b1220}
.phrase-card{min-height:64px;display:flex;align-items:center;font-weight:600}.phrase-card:active{transform:scale(.99)}
.scroll-y{max-height:190px;overflow-y:auto;overflow-x:hidden;padding-right:4px}.ready-player{border-color:#15803d;background:#052e1b}
.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:.75rem;background:#14532d;color:#dcfce7}
.status{color:var(--muted);font-size:.9rem}.error{color:#fecaca;background:#7f1d1d;padding:8px 10px;border-radius:8px}.ok{color:#dcfce7;background:#14532d;padding:8px 10px;border-radius:8px}.muted-box{color:var(--muted);border:1px dashed var(--border);border-radius:10px;padding:10px}.hidden{display:none!important}
</style>
</head>
<body><main class="app">
<section id="home" class="card stack"><div style="display:flex;justify-content:center"><img class="logo" src="logo.png" alt="Logo Chamuyo"/></div><button id="btnCreateRoom">Crear sala</button><button id="btnJoinRoom" class="secondary">Unirse a sala</button><button disabled>Crear/editar listas (próximamente)</button><div id="homeMsg" class="hidden"></div></section>
<section id="flow" class="card stack hidden"></section>
<section id="lobby" class="card stack hidden"><h2 id="lobbyRoomName">Lobby</h2><p id="lobbyMeta"></p><div id="myPhrasesBox" class="stack"></div><ul id="playersList" class="players"></ul><div id="adminActions" class="stack hidden"><button id="btnStartGame">Iniciar partida</button><button id="btnCloseRoom" class="danger">Cerrar sala</button></div></section>
<section id="game" class="card stack hidden"><div style="display:flex;justify-content:center"><img class="logo-sm" src="logo.png" alt="Logo Chamuyo"/></div><h3>Tus frases visibles</h3><ul id="visiblePhrases" class="phrases"></ul><div id="copyMsg" class="hidden"></div><h3>Jugadores</h3><div class="scroll-y"><ul id="gamePlayers" class="players"></ul></div><h3>Eventos recientes</h3><div class="scroll-y"><ul id="recentLogs" class="players"></ul></div></section>
<div id="phraseMenu" class="card hidden" style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,420px);z-index:30"><div id="phraseMenuText" class="muted-box"></div><div class="stack" style="margin-top:8px"><button id="btnSaid" class="success">La dije</button><button id="btnSwap" class="secondary">Intercambiarla</button><button id="btnCloseMenu" class="danger">Cerrar</button></div><div id="menuMsg" class="hidden"></div></div></main>
<script type="module">
import { init, id } from "https://esm.sh/@instantdb/browser";
const APP_ID="REEMPLAZAR_CON_TU_APP_ID"; const app=init({appId:APP_ID}); const CLIENT_ID_KEY="chamuyo_client_id"; const clientId=getOrCreateClientId();
const ui={home:home,flow:flow,lobby:lobby,game:game,homeMsg:homeMsg,btnCreateRoom,btnJoinRoom,lobbyRoomName,lobbyMeta,playersList,adminActions,btnStartGame,btnCloseRoom,myPhrasesBox,visiblePhrases,gamePlayers,recentLogs,copyMsg,phraseMenu,phraseMenuText,btnSaid,btnSwap,btnCloseMenu,menuMsg};
let currentRoomId=null,currentPlayerId=null,selectedPhrase=null;
ui.btnCreateRoom.onclick=showCreateRoomFlow; ui.btnJoinRoom.onclick=showJoinRoomFlow; ui.btnCloseRoom.onclick=closeRoomAsAdmin; ui.btnStartGame.onclick=()=>startGame(currentRoomId); ui.btnCloseMenu.onclick=closePhraseMenu; ui.btnSaid.onclick=()=>selectedPhrase&&markPhraseAsSaid(selectedPhrase); ui.btnSwap.onclick=()=>selectedPhrase&&swapPhrase(selectedPhrase); setInterval(resolveExpiredSaidPhrases,3000);
app.subscribeQuery({rooms:{},players:{},phrases:{},logs:{},phraseAuthors:{}},(resp)=>{if(resp?.error||!currentRoomId)return; const rooms=resp.data.rooms||[],players=(resp.data.players||[]).filter(p=>p.roomId===currentRoomId),phrases=(resp.data.phrases||[]).filter(p=>p.roomId===currentRoomId),logs=(resp.data.logs||[]).filter(l=>l.roomId===currentRoomId); const room=rooms.find(r=>r.id===currentRoomId); if(!room||room.status==="closed"){showMessage(ui.homeMsg,"La sala se cerró.",true);return resetToHome();} if(room.status==="playing") renderGame(room,players,phrases,logs); else renderLobby(room,players,phrases);});

function showCreateRoomFlow(){ui.home.classList.add("hidden");ui.game.classList.add("hidden");ui.lobby.classList.add("hidden");ui.flow.classList.remove("hidden"); ui.flow.innerHTML=`<h2>Crear sala</h2><div class="row"><label>Nombre de sala</label><input id="roomName" class="input" maxlength="30"></div><div class="row"><label>Contraseña</label><input id="roomPass" class="input" type="password" maxlength="30"></div><div class="row"><label>Tu nombre de jugador</label><input id="playerName" class="input" maxlength="24"></div><button id="submitCreate" class="success">Crear y entrar</button><button id="cancelFlow" class="secondary">Cancelar</button><div id="flowMsg" class="hidden"></div>`; submitCreate.onclick=createRoomAndAdmin; cancelFlow.onclick=resetToHome;}
function showJoinRoomFlow(){ui.home.classList.add("hidden");ui.game.classList.add("hidden");ui.lobby.classList.add("hidden");ui.flow.classList.remove("hidden"); ui.flow.innerHTML=`<h2>Unirse a sala</h2><div class="row"><label>Nombre de sala</label><input id="roomName" class="input" maxlength="30"></div><div class="row"><label>Contraseña</label><input id="roomPass" class="input" type="password" maxlength="30"></div><div class="row"><label>Tu nombre de jugador</label><input id="playerName" class="input" maxlength="24"></div><button id="submitJoin" class="success">Entrar</button><button id="cancelFlow" class="secondary">Cancelar</button><div id="flowMsg" class="hidden"></div>`; submitJoin.onclick=joinRoom; cancelFlow.onclick=resetToHome;}
async function createRoomAndAdmin(){const roomName=readInput("roomName"),password=readInput("roomPass"),playerName=readInput("playerName"),msg=flowMsg; if(!roomName||!password||!playerName)return showMessage(msg,"Completá todos los campos.",true); const roomId=id(),playerId=id(),now=Date.now(); const tx=app.tx.rooms[roomId].update({name:roomName,nameNorm:norm(roomName),password,status:"lobby",createdAt:now,adminPlayerId:playerId}).players[playerId].update({roomId,name:playerName,nameNorm:norm(playerName),isAdmin:true,status:"naming",joinedAt:now,points:0,swapsLeft:2,clientId}); await app.transact(tx); await createLog(roomId,`${playerName} se unió a la sala`); currentRoomId=roomId;currentPlayerId=playerId;openLobby();}
async function joinRoom(){const roomName=readInput("roomName"),password=readInput("roomPass"),playerName=readInput("playerName"),msg=flowMsg; if(!roomName||!password||!playerName)return showMessage(msg,"Completá todos los campos.",true); const resp=await app.queryOnce({rooms:{},players:{}}),rooms=resp.data.rooms||[],players=resp.data.players||[]; const room=rooms.find(r=>r.nameNorm===norm(roomName)&&r.status!=="closed"); if(!room)return showMessage(msg,"Sala no encontrada.",true); if(room.password!==password)return showMessage(msg,"Contraseña incorrecta.",true); if(players.some(p=>p.roomId===room.id&&p.nameNorm===norm(playerName)&&p.status!=="left"&&p.status!=="kicked"))return showMessage(msg,"Ese nombre ya está en uso.",true); const playerId=id(); await app.transact(app.tx.players[playerId].update({roomId:room.id,name:playerName,nameNorm:norm(playerName),isAdmin:false,status:"naming",joinedAt:Date.now(),points:0,swapsLeft:2,clientId})); await createLog(room.id,`${playerName} se unió a la sala`); currentRoomId=room.id;currentPlayerId=playerId;openLobby();}
function validatePhraseInputs(raw,existing){const local=new Set(); for(let i=0;i<raw.length;i++){const n=normalizePhrase(raw[i]); if(!n)return{ok:false,error:`La frase ${i+1} está vacía.`}; if(local.has(n))return{ok:false,error:`La frase ${i+1} está repetida en tu lista.`}; if(existing.has(n))return{ok:false,error:`La frase ${i+1} ya existe en la sala.`}; local.add(n);} return{ok:true};}
async function savePlayerPhrases(){const formMsg=document.getElementById("phrasesMsg"),inputs=[...document.querySelectorAll(".phrase-input")].map(e=>e.value||""); const resp=await app.queryOnce({players:{},phrases:{}}); const me=(resp.data.players||[]).find(p=>p.id===currentPlayerId||p.clientId===clientId); if(!me)return showMessage(formMsg,"No se pudo identificar tu jugador.",true); const existing=new Set((resp.data.phrases||[]).filter(ph=>ph.roomId===currentRoomId).map(ph=>ph.textNorm)); const val=validatePhraseInputs(inputs,existing); if(!val.ok)return showMessage(formMsg,val.error,true); let tx=app.tx.players[me.id].update({status:"ready"}); const now=Date.now(); for(const text of inputs){const phraseId=id(),authorId=id(); tx=tx.phrases[phraseId].update({roomId:currentRoomId,text:text.trim(),textNorm:normalizePhrase(text),originalAuthorId:me.id,currentOwnerId:null,visibility:"unassigned",status:"available",source:"player_setup",createdByPlayerId:me.id,createdAt:now}).phraseAuthors[authorId].update({roomId:currentRoomId,phraseId,playerId:me.id,authorType:"original",createdAt:now,active:true});} await app.transact(tx); await createLog(currentRoomId,`${me.name} cargó sus frases`); showMessage(formMsg,"Frases guardadas correctamente.",false);}
function canAdminStartGame(players){const act=players.filter(p=>p.status!=="left"&&p.status!=="kicked"); return act.length>=3&&act.every(p=>p.status==="ready");}
function shuffleArray(array){const arr=[...array]; for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr;}
async function dealPhrases(roomId){const resp=await app.queryOnce({players:{},phrases:{},phraseAuthors:{}}); const players=(resp.data.players||[]).filter(p=>p.roomId===roomId&&p.status!=="left"&&p.status!=="kicked"); const phrases=shuffleArray((resp.data.phrases||[]).filter(ph=>ph.roomId===roomId&&ph.source==="player_setup")); const authors=(resp.data.phraseAuthors||[]).filter(a=>a.roomId===roomId&&a.active); const need=players.length*8; if(phrases.length<need) throw new Error("No hay frases suficientes para repartir");
const assigned=new Set(); const updates=[];
for(const player of players){const owned=[]; for(const phrase of phrases){if(owned.length===8)break; if(assigned.has(phrase.id))continue; const authored=authors.some(a=>a.phraseId===phrase.id&&a.playerId===player.id&&a.active); if(authored||phrase.originalAuthorId===player.id)continue; owned.push(phrase); assigned.add(phrase.id);} if(owned.length<8) throw new Error(`Reparto imposible para ${player.name}`); owned.forEach((ph,idx)=>updates.push({phraseId:ph.id,playerId:player.id,visibility:idx<4?"visible":"hidden"}));}
if(updates.length!==need) throw new Error("Asignación incompleta"); return {players,updates};}
async function startGame(roomId){if(!roomId)return; try{const {players,updates}=await dealPhrases(roomId); let tx=app.tx.rooms[roomId].update({status:"playing"}); for(const p of players) tx=tx.players[p.id].update({status:"playing"}); for(const u of updates) tx=tx.phrases[u.phraseId].update({currentOwnerId:u.playerId,visibility:u.visibility,status:"available"}); await app.transact(tx); await createLog(roomId,"Partida iniciada"); await createLog(roomId,"Se repartieron las frases");}catch(e){console.error("No se pudo iniciar la partida:",e);}}
function getVisiblePhrases(playerId,phrases){return phrases.filter(ph=>ph.currentOwnerId===playerId&&ph.visibility==="visible"&&ph.status==="available");}
async function closeRoomAsAdmin(){if(!currentRoomId||!currentPlayerId)return; const resp=await app.queryOnce({rooms:{},players:{}}); const me=(resp.data.players||[]).find(p=>p.id===currentPlayerId); if(!me?.isAdmin)return; let tx=app.tx.rooms[currentRoomId].delete(); for(const p of (resp.data.players||[]).filter(x=>x.roomId===currentRoomId)) tx=tx.players[p.id].delete(); await app.transact(tx); showMessage(ui.homeMsg,"Sala cerrada.",false); resetToHome();}
function openLobby(){ui.home.classList.add("hidden");ui.flow.classList.add("hidden");ui.game.classList.add("hidden");ui.lobby.classList.remove("hidden");}
function renderLobby(room,players,phrases){const me=players.find(p=>p.clientId===clientId||p.id===currentPlayerId); if(!me)return; ui.lobbyRoomName.textContent=`Sala: ${room.name}`; ui.lobbyMeta.textContent=`${players.length} jugador(es) en lobby`; ui.adminActions.classList.toggle("hidden",!me.isAdmin); ui.btnStartGame.disabled=!canAdminStartGame(players); renderMyPhraseStage(me,phrases); ui.playersList.innerHTML=players.sort((a,b)=>a.joinedAt-b.joinedAt).map(p=>`<li class="${p.status==="ready"?"ready-player":""}"><strong>${escapeHtml(p.name)}</strong>${p.isAdmin?'<span class="tag">Admin</span>':''}${p.clientId===clientId?'<span class="tag">Vos</span>':''}<div class="status">Estado: ${p.status}</div></li>`).join("");}
function renderGame(room,players,phrases,logs){ui.home.classList.add("hidden");ui.flow.classList.add("hidden");ui.lobby.classList.add("hidden");ui.game.classList.remove("hidden"); const me=players.find(p=>p.clientId===clientId||p.id===currentPlayerId); if(!me)return; const visible=getVisiblePhrases(me.id,phrases).slice(0,4); ui.visiblePhrases.innerHTML=visible.map(ph=>`<li><button class="phrase-card" data-id="${ph.id}">${escapeHtml(ph.text)}${ph.status==="pending_said"?`<div class="status">Pendiente: ${formatCountdown(ph.saidDeadlineAt)}</div>`:""}</button></li>`).join("")||"<li class='muted-box'>Sin frases visibles.</li>"; document.querySelectorAll('.phrase-card').forEach(btn=>{const pid=btn.getAttribute('data-id'); const phrase=visible.find(p=>p.id===pid); let timer; btn.onclick=()=>copyPhraseText(phrase); btn.oncontextmenu=(e)=>{e.preventDefault();openPhraseMenu(phrase)}; btn.ontouchstart=()=>{timer=setTimeout(()=>openPhraseMenu(phrase),550)}; btn.ontouchend=()=>clearTimeout(timer); btn.ontouchmove=()=>clearTimeout(timer);}); ui.gamePlayers.innerHTML=players.sort((a,b)=>a.joinedAt-b.joinedAt).map(p=>`<li><strong>${escapeHtml(p.name)}</strong>${p.isAdmin?'<span class="tag">Admin</span>':''}<div class="status">Estado: ${p.status}</div></li>`).join(""); const rec=logs.sort((a,b)=>b.createdAt-a.createdAt).slice(0,5); ui.recentLogs.innerHTML=rec.map(l=>`<li>${escapeHtml(l.message||"Evento")}</li>`).join("");}
function renderMyPhraseStage(me,phrases){const mine=phrases.filter(ph=>ph.originalAuthorId===me.id); if(me.status==="ready"||mine.length>=8){ui.myPhrasesBox.innerHTML='<div class="muted-box">Frases cargadas. Esperando al resto…</div>';return;} const inputs=Array.from({length:8}).map((_,i)=>`<div class="row"><label>Frase ${i+1}</label><input class="phrase-input" maxlength="180"></div>`).join(""); ui.myPhrasesBox.innerHTML=`<h3>Cargá tus 8 frases</h3><p>No se muestran al resto.</p>${inputs}<button id="btnSavePhrases" class="success">Guardar frases</button><div id="phrasesMsg" class="hidden"></div>`; document.getElementById("btnSavePhrases").onclick=savePlayerPhrases;}

async function copyPhraseText(phrase){if(!phrase)return; try{await navigator.clipboard.writeText(phrase.text);showMessage(ui.copyMsg,"Frase copiada",false);}catch{showMessage(ui.copyMsg,"No se pudo copiar",true);}}
function openPhraseMenu(phrase){selectedPhrase=phrase; ui.phraseMenuText.textContent=phrase.text; ui.phraseMenu.classList.remove("hidden"); ui.menuMsg.classList.add("hidden"); const blocked=phrase.status!=="available"; ui.btnSaid.disabled=blocked; ui.btnSwap.disabled=blocked;}
function closePhraseMenu(){ui.phraseMenu.classList.add("hidden"); selectedPhrase=null;}
async function markPhraseAsSaid(phrase){if(phrase.status!=="available")return; const now=Date.now(); try{await app.transact(app.tx.phrases[phrase.id].update({status:"pending_said",saidByPlayerId:currentPlayerId,saidAt:now,saidDeadlineAt:now+300000})); closePhraseMenu();}catch(e){console.error(e);}}
async function swapPhrase(phrase){const resp=await app.queryOnce({phrases:{},players:{}}); const me=(resp.data.players||[]).find(p=>p.id===currentPlayerId); if(!me)return; if(me.swapsLeft<=0){showMessage(ui.menuMsg,"No te quedan intercambios.",true);return;} const mine=(resp.data.phrases||[]).filter(ph=>ph.currentOwnerId===currentPlayerId&&ph.status==="available"); const hidden=mine.filter(ph=>ph.visibility==="hidden"&&ph.id!==phrase.id); if(!hidden.length){showMessage(ui.menuMsg,"No tenés hidden para intercambiar.",true);return;} if(!confirm("Esta carta puede volver como penalización. ¿Continuar?"))return; const pick=hidden[Math.floor(Math.random()*hidden.length)]; await app.transact(app.tx.phrases[phrase.id].update({visibility:"hidden"}).phrases[pick.id].update({visibility:"visible"}).players[currentPlayerId].update({swapsLeft:me.swapsLeft-1})); showMessage(ui.menuMsg,`Intercambio realizado. Te quedan ${me.swapsLeft-1} intercambios.`,false);}
async function resolveExpiredSaidPhrases(){if(!currentRoomId)return; const resp=await app.queryOnce({phrases:{},phraseAuthors:{},players:{}}); const now=Date.now(); const mine=(resp.data.phrases||[]).filter(ph=>ph.roomId===currentRoomId&&ph.currentOwnerId===currentPlayerId&&ph.status==="pending_said"&&ph.saidDeadlineAt<=now); for(const phrase of mine){const fresh=await app.queryOnce({phrases:{}}); const current=(fresh.data.phrases||[]).find(p=>p.id===phrase.id); if(!current||current.status!=="pending_said")continue; try{await app.transact(app.tx.phrases[phrase.id].update({visibility:"discarded",status:"success",discardedAt:Date.now()})); await awardAuthorPoints(current,resp.data.phraseAuthors||[],resp.data.players||[]);}catch(e){console.error("resolve duplicate",e);}}}
async function awardAuthorPoints(phrase,authors,players){const rel=authors.filter(a=>a.phraseId===phrase.id&&a.active); let tx=app.tx.logs[id()].update({roomId:currentRoomId,message:`${(players.find(p=>p.id===currentPlayerId)||{}).name||"Alguien"} logró meter un chamuyo: ${phrase.text}`,createdAt:Date.now(),visibility:"public"}); for(const a of rel){const pl=players.find(p=>p.id===a.playerId); if(!pl)continue; tx=tx.players[pl.id].update({points:(pl.points||0)+1}).logs[id()].update({roomId:currentRoomId,message:`Ganaste 1 punto porque ${(players.find(p=>p.id===currentPlayerId)||{}).name||"alguien"} metió una frase tuya.`,createdAt:Date.now(),visibility:"private",targetPlayerId:pl.id});} await app.transact(tx);}
function formatCountdown(deadline){const ms=Math.max(0,(deadline||0)-Date.now()); const s=Math.floor(ms/1000); const m=Math.floor(s/60); const rs=s%60; return `${m}:${String(rs).padStart(2,"0")}`;}
function normalizePhrase(text){let v=(text||"").trim().toLowerCase(); v=v.normalize("NFD").replace(/[\u0300-\u036f]/g,""); v=v.replace(/^['"“”‘’]+/,"").replace(/['"“”‘’]+$/,""); v=v.replace(/[\.,;:!?]+$/g,""); return v.trim();}
async function createLog(roomId,message){try{await app.transact(app.tx.logs[id()].update({roomId,message,createdAt:Date.now(),visibility:"public"}));}catch{}}
function resetToHome(){currentRoomId=null;currentPlayerId=null;ui.flow.classList.add("hidden");ui.lobby.classList.add("hidden");ui.game.classList.add("hidden");ui.home.classList.remove("hidden");}
function getOrCreateClientId(){let x=localStorage.getItem(CLIENT_ID_KEY); if(!x){x=crypto.randomUUID();localStorage.setItem(CLIENT_ID_KEY,x);} return x;}
const norm=(t)=> (t||"").trim().toLowerCase(); const readInput=(id)=>document.getElementById(id).value.trim();
function showMessage(el,text,isError){el.classList.remove("hidden","error","ok");el.classList.add(isError?"error":"ok");el.textContent=text;}
function escapeHtml(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
</script></body></html>
